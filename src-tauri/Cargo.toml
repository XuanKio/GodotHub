[package]
name = "godot-hub"
version = "0.5.0"
description = "A Windows manager for Godot Engine installations"
edition = "2021"
rust-version = "1.90"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "~2.14.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "process"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_System_SystemInformation", "Win32_UI_Shell"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 8
