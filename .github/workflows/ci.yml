name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Tauri and the windows crate need a Windows MSVC host; this personal repo has no studio runner variable.
    # npm stays to match release-windows.yml and package-lock.json (no churn-only switch to Bun).
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - name: Test and build frontend
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build

      - name: Test backend
        working-directory: src-tauri
        run: |
          rustup update stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
